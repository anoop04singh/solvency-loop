<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340"><title>Architecture overview: wallet-scoped memory, structured intent and Sui authority</title><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f2f8fe"/><stop offset=".6" stop-color="#e3f2fb"/><stop offset="1" stop-color="#e5f1eb"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#285f8d"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="1340" rx="0" fill="url(#wash)" stroke="none"/><text x="60" y="62" font-size="22" font-weight="700" fill="#285f8d" letter-spacing="2">01 / SYSTEM MAP</text><text x="60" y="126" font-size="46" font-weight="700" fill="#142e46" >Different jobs. Explicit authority.</text><rect x="60" y="180" width="1080" height="125" rx="22" fill="#ffffff" stroke="none"/><text x="90" y="228" font-size="31" font-weight="700" fill="#142e46" >Workspace + authenticated application APIs</text><text x="90" y="273" font-size="26" font-weight="400" fill="#405b73" >Wallet owner · chat and manual flows · exact account + request checks</text><path d="M600 306V348" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="370" width="340" height="235" rx="22" fill="#e0efe7" stroke="none"/><text x="85" y="425" font-size="31" font-weight="700" fill="#2f6954" >Walrus Memory</text><text x="85" y="477" font-size="25" font-weight="400" fill="#405b73" >Owned MemWal account</text><text x="85" y="515" font-size="25" font-weight="400" fill="#405b73" >Relayer + recall index</text><text x="85" y="553" font-size="25" font-weight="400" fill="#405b73" >Seal-encrypted blobs</text><rect x="430" y="370" width="340" height="235" rx="22" fill="#d9ebfa" stroke="none"/><text x="455" y="425" font-size="31" font-weight="700" fill="#285f8d" >Gemini</text><text x="455" y="477" font-size="25" font-weight="400" fill="#405b73" >Intent + selected context</text><text x="455" y="515" font-size="25" font-weight="400" fill="#405b73" >Structured JSON proposal</text><text x="455" y="553" font-size="25" font-weight="400" fill="#405b73" >No wallet signing</text><rect x="800" y="370" width="340" height="235" rx="22" fill="#ffffff" stroke="none"/><text x="825" y="425" font-size="31" font-weight="700" fill="#285f8d" >Validation</text><text x="825" y="477" font-size="25" font-weight="400" fill="#405b73" >Real saved contacts</text><text x="825" y="515" font-size="25" font-weight="400" fill="#405b73" >Exact micro-USDC shares</text><text x="825" y="553" font-size="25" font-weight="400" fill="#405b73" >State + policy checks</text><path d="M405 485H424" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M775 485H794" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="60" y="651" font-size="25" font-weight="400" fill="#405b73" >Recall supplies context; verified facts are committed back to memory.</text><path d="M970 606V697" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="720" width="1080" height="134" rx="22" fill="#ffffff" stroke="none"/><text x="90" y="766" font-size="31" font-weight="700" fill="#142e46" >Owner review OR an eligible funded policy</text><text x="90" y="812" font-size="25" font-weight="400" fill="#405b73" >Wallet signer / dedicated executor · audit before autonomous execution</text><path d="M600 855V902" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="925" width="1080" height="122" rx="22" fill="#285f8d" stroke="none"/><text x="90" y="972" font-size="31" font-weight="700" fill="#ffffff" >Shared Sui client → Tatum Mainnet /graphql</text><text x="90" y="1018" font-size="25" font-weight="400" fill="#e5f1fb" >Object reads · balances · events · simulation · signed submission</text><path d="M600 1048V1092" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="1115" width="1080" height="124" rx="22" fill="#ffffff" stroke="none"/><text x="90" y="1164" font-size="31" font-weight="700" fill="#142e46" >Sui Move objects + confirmed events</text><text x="90" y="1209" font-size="25" font-weight="400" fill="#405b73" >Asset authority and invariants → reverified receipt learning → Walrus</text><path d="M60 1272H1140" fill="none" stroke="#c6dcee" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="1300" font-size="21" font-weight="400" fill="#405b73" >Architecture overview · no application database · memory is not spending authority</text></svg>