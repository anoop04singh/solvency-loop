<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1025" viewBox="0 0 1200 1025"><title>Actual unchanged quotas compared with controlled positive regret-shield tests</title><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f2f8fe"/><stop offset=".6" stop-color="#e3f2fb"/><stop offset="1" stop-color="#e5f1eb"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#285f8d"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="1025" rx="0" fill="url(#wash)" stroke="none"/><text x="60" y="62" font-size="22" font-weight="700" fill="#285f8d" letter-spacing="2">03 / REGRET LEARNING</text><text x="60" y="126" font-size="44" font-weight="700" fill="#142e46" >Useful context. Conservative thresholds.</text><rect x="60" y="176" width="510" height="635" rx="22" fill="#ffffff" stroke="none"/><rect x="598" y="176" width="542" height="635" rx="22" fill="#ffffff" stroke="none"/><text x="86" y="224" font-size="22" font-weight="700" fill="#2f6954" letter-spacing="2">ACTUAL WALLET HISTORY</text><text x="86" y="274" font-size="30" font-weight="700" fill="#142e46" >Quotas stayed unchanged</text><text x="86" y="314" font-size="23" font-weight="400" fill="#405b73" >USDC · before → after · bars out of 1</text><text x="86" y="367" font-size="25" font-weight="700" fill="#142e46" >Wallet A</text><text x="535" y="367" font-size="28" font-weight="700" fill="#142e46" text-anchor="end">0.85 → 0.85</text><rect x="86" y="386" width="440" height="12" rx="6" fill="#f2f8fe" stroke="none"/><rect x="86" y="386" width="374" height="12" rx="6" fill="#2f6954" stroke="none"/><text x="86" y="432" font-size="23" font-weight="400" fill="#405b73" >3 ratings · 1 regretted · no shield</text><text x="86" y="493" font-size="25" font-weight="700" fill="#142e46" >Wallet B</text><text x="535" y="493" font-size="28" font-weight="700" fill="#142e46" text-anchor="end">0.79 → 0.79</text><rect x="86" y="512" width="440" height="12" rx="6" fill="#f2f8fe" stroke="none"/><rect x="86" y="512" width="347.6" height="12" rx="6" fill="#2f6954" stroke="none"/><text x="86" y="558" font-size="23" font-weight="400" fill="#405b73" >2 ratings · 1 regretted · no shield</text><text x="86" y="619" font-size="25" font-weight="700" fill="#142e46" >Wallet C</text><text x="535" y="619" font-size="28" font-weight="700" fill="#142e46" text-anchor="end">0.79 → 0.79</text><rect x="86" y="638" width="440" height="12" rx="6" fill="#f2f8fe" stroke="none"/><rect x="86" y="638" width="347.6" height="12" rx="6" fill="#2f6954" stroke="none"/><text x="86" y="684" font-size="23" font-weight="400" fill="#405b73" >2 ratings · 1 regretted · no shield</text><text x="86" y="776" font-size="23" font-weight="400" fill="#405b73" >Seven owner-randomized check-ins.</text><text x="624" y="224" font-size="22" font-weight="700" fill="#285f8d" letter-spacing="2">CONTROLLED TEST ONLY</text><text x="624" y="274" font-size="30" font-weight="700" fill="#142e46" >When the rule does react</text><text x="624" y="314" font-size="22" font-weight="400" fill="#405b73" >100 USDC balance · 20 reserve · 10 unpaid</text><text x="624" y="364" font-size="25" font-weight="700" fill="#142e46" >No qualifying pattern</text><rect x="624" y="387" width="96.80000000000001" height="30" rx="4" fill="#879bad" stroke="none"/><rect x="720.8" y="387" width="48.400000000000006" height="30" rx="0" fill="#d9aa62" stroke="none"/><rect x="769.2" y="387" width="0" height="30" rx="0" fill="#abcde4" stroke="none"/><rect x="769.2" y="387" width="338.8" height="30" rx="4" fill="#2f6954" stroke="none"/><text x="624" y="452" font-size="23" font-weight="400" fill="#405b73" >Quota 70 · shield 0 USDC</text><text x="624" y="490" font-size="25" font-weight="700" fill="#142e46" >Three qualifying regrets</text><rect x="624" y="513" width="96.80000000000001" height="30" rx="4" fill="#879bad" stroke="none"/><rect x="720.8" y="513" width="48.400000000000006" height="30" rx="0" fill="#d9aa62" stroke="none"/><rect x="769.2" y="513" width="145.2" height="30" rx="0" fill="#abcde4" stroke="none"/><rect x="914.4" y="513" width="193.6" height="30" rx="4" fill="#2f6954" stroke="none"/><text x="624" y="578" font-size="23" font-weight="400" fill="#405b73" >Quota 40 · shield 30 USDC</text><text x="624" y="616" font-size="25" font-weight="700" fill="#142e46" >Plus lower cash-flow context</text><rect x="624" y="639" width="96.80000000000001" height="30" rx="4" fill="#879bad" stroke="none"/><rect x="720.8" y="639" width="48.400000000000006" height="30" rx="0" fill="#d9aa62" stroke="none"/><rect x="769.2" y="639" width="181.5" height="30" rx="0" fill="#abcde4" stroke="none"/><rect x="950.7" y="639" width="157.3" height="30" rx="4" fill="#2f6954" stroke="none"/><text x="624" y="704" font-size="23" font-weight="400" fill="#405b73" >Quota 32.5 · shield 37.5 USDC</text><rect x="70" y="860" width="18" height="18" rx="4" fill="#879bad" stroke="none"/><text x="101" y="878" font-size="24" font-weight="400" fill="#142e46" >Reserve</text><rect x="353" y="860" width="18" height="18" rx="4" fill="#d9aa62" stroke="none"/><text x="384" y="878" font-size="24" font-weight="400" fill="#142e46" >Unpaid</text><rect x="636" y="860" width="18" height="18" rx="4" fill="#abcde4" stroke="none"/><text x="667" y="878" font-size="24" font-weight="400" fill="#142e46" >Shield</text><rect x="919" y="860" width="18" height="18" rx="4" fill="#2f6954" stroke="none"/><text x="950" y="878" font-size="24" font-weight="400" fill="#142e46" >Quota</text><text x="60" y="948" font-size="24" font-weight="400" fill="#405b73" >A needs more regretted outcomes; B and C need more samples.</text><text x="60" y="983" font-size="24" font-weight="400" fill="#405b73" >Controlled cases verify the formula, not improved consumer outcomes.</text></svg>