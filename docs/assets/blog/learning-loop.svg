<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715"><title>A conceptual manual loop: recall, interpret, validate, approve, confirm and remember</title><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f2f8fe"/><stop offset=".6" stop-color="#e3f2fb"/><stop offset="1" stop-color="#e5f1eb"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#285f8d"/></marker></defs><style>text{font-family:"Segoe UI",Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="715" rx="0" fill="url(#wash)" stroke="none"/><text x="60" y="60" font-size="22" font-weight="700" fill="#285f8d" letter-spacing="2">02 / THE MANUAL LEARNING LOOP</text><text x="60" y="121" font-size="42" font-weight="700" fill="#142e46" >The next split starts with more context.</text><text x="60" y="170" font-size="26" font-weight="400" fill="#405b73" >Recall → propose → review → confirm → learn</text><path d="M404 305H422" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M774 305H792" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M970 375V423" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M795 505H777" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M425 505H407" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M60 505H26V305H50" fill="none" stroke="#285f8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="235" width="340" height="140" rx="22" fill="#ffffff" stroke="none"/><text x="84" y="282" font-size="24" font-weight="700" fill="#285f8d" >01</text><text x="136" y="284" font-size="31" font-weight="700" fill="#142e46" >Recall</text><text x="136" y="333" font-size="25" font-weight="400" fill="#405b73" >Owned memory</text><rect x="430" y="235" width="340" height="140" rx="22" fill="#ffffff" stroke="none"/><text x="454" y="282" font-size="24" font-weight="700" fill="#285f8d" >02</text><text x="506" y="284" font-size="31" font-weight="700" fill="#142e46" >Interpret</text><text x="506" y="333" font-size="25" font-weight="400" fill="#405b73" >Gemini proposal</text><rect x="800" y="235" width="340" height="140" rx="22" fill="#ffffff" stroke="none"/><text x="824" y="282" font-size="24" font-weight="700" fill="#285f8d" >03</text><text x="876" y="284" font-size="31" font-weight="700" fill="#142e46" >Validate</text><text x="876" y="333" font-size="25" font-weight="400" fill="#405b73" >Exact app rules</text><rect x="800" y="435" width="340" height="140" rx="22" fill="#ffffff" stroke="none"/><text x="824" y="482" font-size="24" font-weight="700" fill="#285f8d" >04</text><text x="876" y="484" font-size="31" font-weight="700" fill="#142e46" >Approve</text><text x="876" y="533" font-size="25" font-weight="400" fill="#405b73" >Owner review</text><rect x="430" y="435" width="340" height="140" rx="22" fill="#ffffff" stroke="none"/><text x="454" y="482" font-size="24" font-weight="700" fill="#285f8d" >05</text><text x="506" y="484" font-size="31" font-weight="700" fill="#142e46" >Confirm</text><text x="506" y="533" font-size="25" font-weight="400" fill="#405b73" >Sui receipt</text><rect x="60" y="435" width="340" height="140" rx="22" fill="#ffffff" stroke="none"/><text x="84" y="482" font-size="24" font-weight="700" fill="#285f8d" >06</text><text x="136" y="484" font-size="31" font-weight="700" fill="#142e46" >Remember</text><text x="136" y="533" font-size="25" font-weight="400" fill="#405b73" >Verified facts</text><text x="60" y="627" font-size="23" font-weight="400" fill="#405b73" >Conceptual flow · no live 